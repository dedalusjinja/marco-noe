<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee5d8">
<title>10 anni insieme</title>

<meta property="og:title" content="10 anni insieme ❤️">
<meta property="og:description" content="24 ottobre 2026 · IYO Kaiseki">
<meta property="og:image" content="https://dedalusjinja.github.io/marco-noe/busta.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://dedalusjinja.github.io/marco-noe/busta.png">

<style>
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  overflow: hidden;
  background: #e7dccb;
  -webkit-tap-highlight-color: transparent;
}

.scene {
  position: relative;
  width: 100%;
  height: 100dvh;
  overflow: hidden;
  display: grid;
  place-items: center;
  perspective: 1800px;
  background:
    radial-gradient(circle at 50% 15%, rgba(255,255,255,.92), transparent 34%),
    linear-gradient(180deg, #efe7db, #dfd1bd);
}

.hint {
  position: absolute;
  top: calc(35px + env(safe-area-inset-top));
  left: 0;
  right: 0;
  text-align: center;
  font: 600 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: .28em;
  color: #76664f;
  transition: opacity .3s ease;
}

.envelope {
  position: relative;
  width: min(89vw, 455px);
  aspect-ratio: 1.45/1;
  cursor: pointer;
  transform-style: preserve-3d;
  filter: drop-shadow(0 22px 28px rgba(54,36,13,.16));
}

.back {
  position: absolute;
  inset: 0;
  z-index: 1;
  border-radius: 11px;
  background: #f7f0e5;
  border: 1px solid rgba(126,95,46,.18);
}

.card-viewport {
  position: absolute;
  z-index: 3;
  left: 0;
  right: 0;
  bottom: 0;
  height: 200%;
  overflow: hidden;
  pointer-events: none;
}

.card {
  position: absolute;
  z-index: 3;
  width: 68%;
  left: 16%;
  top: 128%;
  aspect-ratio: .69/1;
  border-radius: 7px;
  overflow: hidden;
  background: #fffaf2;
  box-shadow: 0 10px 26px rgba(39,25,8,.18);
  will-change: transform;
}

.card img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.open-triangle {
  position: absolute;
  z-index: 2;
  left: 0;
  right: 0;
  bottom: 100%;
  height: 60%;
  opacity: 0;
  transform: scaleY(.04);
  transform-origin: 50% 100%;
  clip-path: polygon(0 100%, 50% 0, 100% 100%);
  background: linear-gradient(180deg, #e7d8c2, #faf3e8);
}

.left, .right, .bottom {
  position: absolute;
  z-index: 5;
  pointer-events: none;
}

.left {
  inset: 0 50% 0 0;
  background: linear-gradient(35deg, #e8dac5, #f7f0e5);
  clip-path: polygon(0 0, 100% 51%, 0 100%);
}

.right {
  inset: 0 0 0 50%;
  background: linear-gradient(325deg, #e8dac5, #f7f0e5);
  clip-path: polygon(100% 0, 0 51%, 100% 100%);
}

.bottom {
  left: 0;
  right: 0;
  bottom: 0;
  height: 59%;
  border-radius: 0 0 11px 11px;
  background: linear-gradient(180deg, #f1e7d7, #e4d4bd);
  clip-path: polygon(0 100%, 0 0, 50% 52%, 100% 0, 100% 100%);
}

.flap {
  position: absolute;
  inset: 0;
  z-index: 7;
  transform-origin: 50% 0;
  backface-visibility: hidden;
  background: linear-gradient(180deg, #fbf6ed, #e6d8c3);
  clip-path: polygon(0 0, 100% 0, 50% 60%);
  will-change: transform;
}

.seal {
  position: absolute;
  z-index: 9;
  left: 50%;
  top: 45%;
  transform: translate(-50%,-50%) rotate(-2deg);
  width: 75px;
  height: 73px;
  border-radius: 48% 52% 44% 56% / 55% 45% 55% 45%;
  display: grid;
  place-items: center;
  color: #e9c8aa;
  font: 20px Georgia, serif;
  background:
    radial-gradient(circle at 31% 25%, rgba(255,255,255,.17), transparent 13%),
    linear-gradient(145deg, #a8312d, #731917 68%, #5f1111);
  box-shadow:
    0 8px 13px rgba(75,18,15,.25),
    inset 3px 4px 7px rgba(255,178,142,.10);
}

.seal::after {
  content: "永遠";
  width: 48px;
  height: 47px;
  border: 1px solid rgba(236,201,169,.47);
  border-radius: 50%;
  display: grid;
  place-items: center;
}

.card.takeover {
  position: fixed;
  z-index: 50;
  margin: 0;
  transform: none !important;
  transition:
    left 1.12s cubic-bezier(.16,.78,.18,1),
    top 1.12s cubic-bezier(.16,.78,.18,1),
    width 1.12s cubic-bezier(.16,.78,.18,1),
    height 1.12s cubic-bezier(.16,.78,.18,1),
    box-shadow .9s ease;
}

.close {
  position: fixed;
  z-index: 70;
  top: calc(14px + env(safe-area-inset-top));
  right: 14px;
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: rgba(255,255,255,.82);
  color: #51432f;
  font-size: 25px;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 5px 18px rgba(0,0,0,.09);
  transition: opacity .4s ease;
}

.close.show {
  opacity: 1;
  pointer-events: auto;
}
</style>
</head>

<body>
<main class="scene">
  <div class="hint" id="hint">TOCCA PER APRIRE</div>

  <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Apri l'invito">
    <div class="back"></div>
    <div class="open-triangle" id="triangle"></div>

    <div class="card-viewport">
      <div class="card" id="card">
        <img src="invito.png" alt="10 anni insieme">
      </div>
    </div>

    <div class="left"></div>
    <div class="right"></div>
    <div class="bottom"></div>
    <div class="flap" id="flap"></div>
    <div class="seal" id="seal"></div>
  </div>

  <button class="close" id="close" aria-label="Chiudi">×</button>
</main>

<script>
const envelope = document.getElementById('envelope');
const card = document.getElementById('card');
const flap = document.getElementById('flap');
const triangle = document.getElementById('triangle');
const seal = document.getElementById('seal');
const hint = document.getElementById('hint');
const closeBtn = document.getElementById('close');

let busy = false;
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const anim = (element, frames, options) =>
  element.animate(frames, { fill: 'forwards', ...options }).finished;

async function openInvite() {
  if (busy) return;
  busy = true;
  hint.style.opacity = '0';

  await anim(seal, [
    { opacity: 1, transform: 'translate(-50%,-50%) rotate(-2deg) scale(1)' },
    { opacity: 0, transform: 'translate(-50%,-46%) rotate(6deg) scale(.82)' }
  ], { duration: 300, easing: 'ease-out' });

  await Promise.all([
    anim(flap, [
      { transform: 'rotateX(0)' },
      { transform: 'rotateX(90deg)', offset: .5 },
      { transform: 'rotateX(180deg)' }
    ], { duration: 850, easing: 'cubic-bezier(.22,.64,.2,1)' }),

    anim(triangle, [
      { opacity: 0, transform: 'scaleY(.04)' },
      { opacity: 1, transform: 'scaleY(1)' }
    ], { duration: 850, easing: 'cubic-bezier(.22,.64,.2,1)' })
  ]);

  await anim(card, [
    { transform: 'translateY(0)' },
    { transform: 'translateY(-28%)', offset: .24 },
    { transform: 'translateY(-73%)', offset: .55 },
    { transform: 'translateY(-126%)', offset: .82 },
    { transform: 'translateY(-155%)' }
  ], { duration: 1450, easing: 'cubic-bezier(.18,.58,.14,1)' });

  await wait(380);

  const rect = card.getBoundingClientRect();
  card.getAnimations().forEach(animation => animation.cancel());
  document.body.appendChild(card);
  card.classList.add('takeover');

  Object.assign(card.style, {
    left: rect.left + 'px',
    top: rect.top + 'px',
    width: rect.width + 'px',
    height: rect.height + 'px'
  });

  card.getBoundingClientRect();

  await anim(envelope, [
    { opacity: 1, transform: 'scale(1)' },
    { opacity: 0, transform: 'scale(.985)' }
  ], { duration: 500, easing: 'ease-in-out' });

  envelope.style.display = 'none';
  await wait(140);

  const ratio = rect.width / rect.height;
  const maxHeight = innerHeight * .92;
  const maxWidth = innerWidth * .94;
  let height = maxHeight;
  let width = height * ratio;

  if (width > maxWidth) {
    width = maxWidth;
    height = width / ratio;
  }

  requestAnimationFrame(() => Object.assign(card.style, {
    left: (innerWidth - width) / 2 + 'px',
    top: (innerHeight - height) / 2 + 'px',
    width: width + 'px',
    height: height + 'px',
    boxShadow: '0 30px 75px rgba(45,29,9,.25)'
  }));

  await wait(1180);
  closeBtn.classList.add('show');
}

envelope.addEventListener('click', openInvite);
envelope.addEventListener('keydown', event => {
  if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    openInvite();
  }
});
closeBtn.addEventListener('click', () => location.reload());
</script>
</body>
</html>
