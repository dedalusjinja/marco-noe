<!doctype html>
<html lang="it">
<meta property="og:title" content="10 anni insieme ❤️">
<meta property="og:description" content="24 ottobre 2026 · IYO Kaiseki">
<meta property="og:type" content="website">
<meta property="og:url" content="https://dedalusjinja.github.io/marco-noe/">
<meta property="og:image" content="https://dedalusjinja.github.io/marco-noe/invito.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#e9dfcf">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#e9dfcf" />
<title>10 anni insieme</title>
<style>
:root{
  --ivory:#f6efe4;
  --ivory2:#eadfcd;
  --gold:#b89a5a;
  --gold2:#8e6f36;
  --ink:#1d1a16;
  --wax:#8d1f1f;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 14%,rgba(255,255,255,.92),transparent 28%),
    radial-gradient(circle at 50% 100%,rgba(150,120,70,.10),transparent 38%),
    linear-gradient(#eee5d8,#dfd2c0);
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
  -webkit-tap-highlight-color:transparent;
}
body:before{
  content:"";
  position:fixed; inset:0;
  pointer-events:none;
  opacity:.25;
  background-image:
    linear-gradient(rgba(80,60,30,.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(80,60,30,.02) 1px,transparent 1px);
  background-size:4px 4px;
  mix-blend-mode:multiply;
}
.stage{
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:calc(18px + env(safe-area-inset-top)) 18px calc(22px + env(safe-area-inset-bottom));
  perspective:1800px;
  position:relative;
}
.caption{
  position:absolute;
  top:calc(24px + env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  font:600 11px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:#6d604c;
  transition:opacity .5s ease;
  white-space:nowrap;
}
.envelope-wrap{
  width:min(89vw,440px);
  aspect-ratio:1.44/1;
  position:relative;
  transform-style:preserve-3d;
  cursor:pointer;
  transition:transform 1s cubic-bezier(.2,.7,.15,1);
  filter:drop-shadow(0 24px 34px rgba(44,31,12,.20));
  animation:floaty 4.8s ease-in-out infinite;
}
@keyframes floaty{
  0%,100%{transform:translateY(0) rotateX(0deg)}
  50%{transform:translateY(-5px) rotateX(1deg)}
}
.env{
  position:absolute; inset:0;
  border-radius:14px;
  background:var(--ivory);
  border:1px solid rgba(128,96,45,.25);
  overflow:visible;
  transform-style:preserve-3d;
}
.back{
  position:absolute; inset:0;
  border-radius:14px;
  background:
    linear-gradient(145deg,rgba(255,255,255,.50),transparent 46%),
    var(--ivory);
  overflow:hidden;
}
.back:after{
  content:"";
  position:absolute; inset:0;
  background:
    linear-gradient(135deg,transparent 49.7%,rgba(184,154,90,.16) 50%,transparent 50.3%),
    linear-gradient(225deg,transparent 49.7%,rgba(184,154,90,.16) 50%,transparent 50.3%);
}
.card{
  position:absolute;
  z-index:3;
  left:9%;
  width:82%;
  top:15%;
  aspect-ratio:.69/1;
  overflow:hidden;
  border-radius:7px;
  background:#fffaf1;
  box-shadow:0 10px 26px rgba(30,20,8,.18);
  transform:translateY(43%) scale(.93) rotateX(-2deg);
  transition:
    transform 1.55s cubic-bezier(.16,.77,.16,1) .72s,
    width 1.2s ease 1.1s,
    left 1.2s ease 1.1s,
    top 1.2s ease 1.1s,
    box-shadow 1s ease .9s;
}
.card img{width:100%;height:100%;display:block;object-fit:cover}
.pocket-left,.pocket-right,.pocket-bottom{
  position:absolute;z-index:5;pointer-events:none;
}
.pocket-left{
  inset:0 50% 0 0;
  background:linear-gradient(35deg,#eadfcd,#f6efe4);
  clip-path:polygon(0 0,100% 50%,0 100%);
}
.pocket-right{
  inset:0 0 0 50%;
  background:linear-gradient(325deg,#eadfcd,#f6efe4);
  clip-path:polygon(100% 0,0 50%,100% 100%);
}
.pocket-bottom{
  inset:47% 0 0 0;
  background:linear-gradient(#efe5d5,#e5d7c1);
  clip-path:polygon(0 100%,0 0,50% 53%,100% 0,100% 100%);
}
.flap{
  position:absolute; inset:0;
  z-index:7;
  background:linear-gradient(#f9f3ea,#e6d8c4);
  clip-path:polygon(0 0,100% 0,50% 59%);
  transform-origin:50% 0%;
  transform:rotateX(0deg);
  transition:transform 1.2s cubic-bezier(.18,.72,.2,1);
  backface-visibility:hidden;
}
.wax{
  position:absolute;
  z-index:10;
  left:50%; top:44%;
  width:76px; height:76px;
  transform:translate(-50%,-50%);
  border-radius:46% 54% 49% 51% / 53% 48% 52% 47%;
  display:grid; place-items:center;
  background:
    radial-gradient(circle at 35% 30%,#b94a46 0 10%,transparent 11%),
    radial-gradient(circle at 72% 68%,rgba(255,255,255,.08),transparent 28%),
    linear-gradient(145deg,#a73531,#6f1717);
  color:#f0d7b8;
  box-shadow:
    0 8px 14px rgba(74,20,16,.28),
    inset 0 0 0 2px rgba(245,205,160,.18),
    inset 0 -7px 12px rgba(44,0,0,.22);
  font-size:20px;
  letter-spacing:.02em;
  transition:opacity .42s ease .28s, transform .55s ease .18s;
}
.wax:after{
  content:"永遠";
  width:46px;height:46px;border-radius:50%;
  border:1px solid rgba(240,215,184,.55);
  display:grid;place-items:center;
}
.open .caption{opacity:0}
.open .flap{transform:rotateX(180deg)}
.open .wax{opacity:0;transform:translate(-50%,-50%) scale(.78) rotate(8deg)}
.open .card{
  transform:translateY(-48%) scale(1.01) rotateX(0);
  box-shadow:0 28px 54px rgba(30,20,8,.26);
}
.open .envelope-wrap{animation:none}
.glow{
  position:fixed; inset:0;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(circle at 50% 38%,rgba(255,246,218,.78),transparent 28%);
  transition:opacity .8s ease;
  z-index:20;
}
.glow.show{opacity:1}
.viewer{
  position:fixed; inset:0;
  z-index:30;
  display:grid;
  place-items:center;
  padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 50% 20%,rgba(255,255,255,.80),transparent 30%),
    rgba(233,223,207,.965);
  backdrop-filter:blur(12px);
  opacity:0; visibility:hidden;
  transition:opacity .75s ease,visibility .75s ease;
}
.viewer.show{opacity:1;visibility:visible}
.viewer-card{
  height:min(93dvh,980px);
  max-width:94vw;
  aspect-ratio:.69/1;
  overflow:hidden;
  border-radius:9px;
  background:#fff;
  box-shadow:0 30px 80px rgba(45,30,10,.28);
  transform:translateY(24px) scale(.975);
  transition:transform 1s cubic-bezier(.16,.78,.16,1);
}
.viewer.show .viewer-card{transform:none}
.viewer-card img{width:100%;height:100%;display:block;object-fit:cover}
.close{
  position:fixed;
  top:calc(14px + env(safe-area-inset-top));
  right:14px;
  width:42px;height:42px;
  border-radius:50%;
  border:1px solid rgba(120,90,40,.16);
  background:rgba(255,255,255,.78);
  color:#51432f;
  font-size:24px;
  line-height:1;
  box-shadow:0 5px 18px rgba(0,0,0,.10);
}
.sound-note{
  position:fixed;
  bottom:calc(16px + env(safe-area-inset-bottom));
  left:50%; transform:translateX(-50%);
  font:500 11px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#77674e;
  letter-spacing:.08em;
  opacity:.78;
  z-index:2;
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="caption">Tocca per aprire</div>

  <div class="envelope-wrap" id="envelope" role="button" tabindex="0" aria-label="Apri il Save the Date">
    <div class="env">
      <div class="back"></div>
      <div class="card"><img src="invito.png" alt=""></div>
      <div class="pocket-left"></div>
      <div class="pocket-right"></div>
      <div class="pocket-bottom"></div>
      <div class="flap"></div>
      <div class="wax"></div>
    </div>
  </div>

  <div class="sound-note">10 anni insieme · 24 ottobre 2026</div>
</main>

<div class="glow" id="glow"></div>

<section class="viewer" id="viewer" aria-hidden="true">
  <button class="close" id="close" aria-label="Chiudi">×</button>
  <div class="viewer-card">
    <img src="invito.png" alt="10 anni insieme — 24 ottobre 2026, ore 19:00, IYO Kaiseki">
  </div>
</section>

<script>
const envelope = document.getElementById('envelope');
const stage = document.getElementById('stage');
const viewer = document.getElementById('viewer');
const glow = document.getElementById('glow');
const closeBtn = document.getElementById('close');

let opened = false;
let timers = [];

function later(fn, ms){
  const t = setTimeout(fn, ms);
  timers.push(t);
}
function openInvite(){
  if(opened) return;
  opened = true;
  stage.classList.add('open');

  later(()=>glow.classList.add('show'), 1150);
  later(()=>{
    viewer.classList.add('show');
    viewer.setAttribute('aria-hidden','false');
  }, 2100);
  later(()=>glow.classList.remove('show'), 2700);
}
function resetInvite(){
  timers.forEach(clearTimeout);
  timers = [];
  viewer.classList.remove('show');
  viewer.setAttribute('aria-hidden','true');
  glow.classList.remove('show');
  later(()=>{
    stage.classList.remove('open');
    opened = false;
  }, 450);
}

envelope.addEventListener('click', openInvite);
envelope.addEventListener('keydown', e=>{
  if(e.key==='Enter' || e.key===' '){
    e.preventDefault();
    openInvite();
  }
});
closeBtn.addEventListener('click', resetInvite);
</script>
</body>
</html>
